networks:
  pihole-net:

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "127.0.0.1:53:53/tcp"
      - "127.0.0.1:53:53/udp"
      - "127.0.0.1:80:80/tcp"
      - "127.0.0.1:443:443/tcp"
    environment:
      TZ: '${TZ}'
      FTLCONF_webserver_api_password: '${PIHOLE_WEB_PASSWORD}'
      FTLCONF_dns_listeningMode: 'ALL'
      FTLCONF_dns_upstreams: '${FTL_DNS_UPSTREAMS}'
    volumes:
      - './etc-pihole:/etc/pihole'
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    restart: unless-stopped
    networks:
      - pihole-net

  pihole-init:
    container_name: pihole-init
    image: alpine:latest
    depends_on:
      pihole:
        condition: service_healthy
    environment:
      PIHOLE_WEB_PASSWORD: '${PIHOLE_WEB_PASSWORD}'
    volumes:
      - './init-pihole.sh:/init-pihole.sh:ro'
    entrypoint: ["sh", "-c", "apk add --no-cache curl jq >/dev/null && sh /init-pihole.sh"]
    restart: "no"
    networks:
      - pihole-net
